name: Build disc index

on:
  schedule:
    - cron: "17 4 * * 1"  # weekly, Monday 04:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/build_index.py]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch TheDiscDB data (text files only)
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/TheDiscDb/data.git discdb
          cd discdb
          git sparse-checkout set --no-cone '/data/**/*-summary.txt' '/data/**/metadata.json' '/data/**/tmdb.json'
          echo "DISCDB_SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Build index
        run: python3 scripts/build_index.py discdb data/index.json

      - name: Commit if changed
        run: |
          if git diff --quiet -- data/index.json; then
            echo "Index unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/index.json
          git commit -m "Update disc index from TheDiscDB ${DISCDB_SHA}"
          git push
